<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle do LED</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f5f9;
        }

        .container {
            width: 400px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;

            color: #222;
        }

        p {
            color: #666;
        }

        .led {
            font-size: 70px;

            margin: 20px;
        }

        button {
            width: 100%;

            padding: 18px;

            margin-top: 12px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: bold;

            color: white;

            cursor: pointer;
        }

        #ligar {
            background: #20a05a;
        }

        #desligar {
            background: #d93636;
        }

        button:hover {
            opacity: 0.85;
        }

        #status {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: #eeeeee;
        }

        #valor {
            font-size: 25px;

            font-weight: bold;

            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="led">💡</div>

        <h1>Controle do LED</h1>

        <p>Casa Adaptada</p>

        <button id="ligar">
            LIGAR LED
        </button>

        <button id="desligar">
            DESLIGAR LED
        </button>

        <div id="status">
            Conectando ao Firebase...
        </div>

        <p>Valor atual no Firebase:</p>

        <div id="valor">
            --
        </div>

    </div>


    <script>

        // =====================================
        // CONFIGURAÇÃO DO FIREBASE
        // =====================================

        const DATABASE_URL =
        "https://casa-adaptada-default-rtdb.europe-west1.firebasedatabase.app";


        // =====================================
        // ELEMENTOS DA PÁGINA
        // =====================================

        const botaoLigar =
        document.getElementById("ligar");

        const botaoDesligar =
        document.getElementById("desligar");

        const status =
        document.getElementById("status");

        const valor =
        document.getElementById("valor");


        // =====================================
        // FUNÇÃO PARA LIGAR / DESLIGAR
        // =====================================

        async function alterarLED(numero) {

            status.innerText =
            "Enviando comando...";

            try {

                const resposta = await fetch(

                    DATABASE_URL + "/led.json",

                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                            "application/json"
                        },

                        body:
                        JSON.stringify(numero)
                    }

                );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro HTTP: " +
                        resposta.status
                    );

                }


                const resultado =
                await resposta.json();


                // Mostra o valor enviado

                if (resultado === 1) {

                    valor.innerText =
                    "1 - LIGADO";

                    status.innerText =
                    "LED ligado com sucesso!";

                } else {

                    valor.innerText =
                    "0 - DESLIGADO";

                    status.innerText =
                    "LED desligado com sucesso!";
                }


            } catch (erro) {

                console.error(erro);

                status.innerText =
                "Erro ao comunicar com o Firebase.";

            }

        }


        // =====================================
        // BOTÃO LIGAR
        // =====================================

        botaoLigar.addEventListener(
            "click",
            function() {

                alterarLED(1);

            }
        );


        // =====================================
        // BOTÃO DESLIGAR
        // =====================================

        botaoDesligar.addEventListener(
            "click",
            function() {

                alterarLED(0);

            }
        );


        // =====================================
        // LER VALOR DO FIREBASE
        // =====================================

        async function lerLED() {

            try {

                const resposta =
                await fetch(

                    DATABASE_URL +
                    "/led.json?" +
                    Date.now()

                );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao acessar Firebase"
                    );

                }


                const resultado =
                await resposta.json();


                if (resultado === 1) {

                    valor.innerText =
                    "1 - LIGADO";

                    status.innerText =
                    "Firebase conectado";

                }

                else if (resultado === 0) {

                    valor.innerText =
                    "0 - DESLIGADO";

                    status.innerText =
                    "Firebase conectado";

                }

                else {

                    valor.innerText =
                    resultado;

                    status.innerText =
                    "Firebase conectado";
                }


            } catch (erro) {

                console.error(erro);

                status.innerText =
                "Não foi possível acessar o Firebase.";
            }

        }


        // Ler o valor quando abrir a página

        lerLED();


        // Atualizar a cada 2 segundos

        setInterval(
            lerLED,
            2000
        );

    </script>

</body>

</html>
